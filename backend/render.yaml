    name: tuklas-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://jnfegvodjkqsqectopfb.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_EnaZt-_3dsq-D4_B_mdbUA_3bHbOxzQ
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-v4.1-flash
      - key: LLM_REASONING_EFFORT
        value: none
      - key: VOICE_FIL
        value: Xb7hH8MSUJpSbSDYk0k2
